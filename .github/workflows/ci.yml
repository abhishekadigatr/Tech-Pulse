name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Build-time keys are random and ephemeral; production keys come from the
      # deployment platform's secret store, never from source control.
      - name: Generate ephemeral build keys
        run: |
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run build
